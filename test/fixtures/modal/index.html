<!doctype html><html><head><meta charset="utf-8"><title>Modal</title><link rel="stylesheet" href="../style.css">
<style>
  .backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s}
  .backdrop.open{opacity:1;pointer-events:auto}
  .dialog{background:#fff;padding:24px;border-radius:14px;width:380px;transform:translateY(40px) scale(.96);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  .backdrop.open .dialog{transform:none}
  #cookie{position:fixed;left:0;right:0;bottom:0;padding:22px;background:#0f172a;color:#fff;text-align:center;height:200px}
</style></head>
<body><main>
  <h1>Projects (modal)</h1>
  <p id="state" class="muted">1 project</p>
  <div style="height:520px"></div>
  <button id="del">Delete project</button>
</main>
<div id="cookie">We use cookies (this banner covers the button for a moment)</div>
<div class="backdrop" id="bd"><div class="dialog" role="dialog" aria-label="Delete project?">
  <h2 style="margin-top:0">Delete project?</h2><p class="muted">This can't be undone.</p>
  <button class="secondary" id="cancel">Cancel</button> <button id="confirm">Delete</button>
</div></div>
<script>
  setTimeout(function () { document.getElementById('cookie').remove(); }, 1200);
  var bd = document.getElementById('bd');
  document.getElementById('del').onclick = function () { bd.classList.add('open'); };
  document.getElementById('cancel').onclick = function () { bd.classList.remove('open'); };
  document.getElementById('confirm').onclick = function () { bd.classList.remove('open'); document.getElementById('state').textContent = '0 projects'; };
  window.__verify = function () {
    var t = document.getElementById('state').textContent;
    return { ok: t === '0 projects' && !bd.classList.contains('open'), detail: t };
  };
</script></body></html>
