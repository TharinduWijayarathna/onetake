<!doctype html><html><head><meta charset="utf-8"><title>Sent</title><link rel="stylesheet" href="../style.css"></head>
<body><main>
  <h1 id="title"></h1>
  <p id="detail" class="muted"></p>
  <p class="muted">Sent on <span id="when"></span></p>
</main>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById('title').textContent = 'Thanks, ' + q.get('name');
  document.getElementById('detail').textContent = q.get('kind') + ' from ' + q.get('email') + ': ' + q.get('msg');
  document.getElementById('when').textContent = new Date().toISOString().slice(0, 10);
  window.__verify = function () {
    var ok = q.get('name') === 'Priya Raman' && q.get('email') === 'priya@lumen.dev' && q.get('kind') === 'Quote' && q.get('msg') === 'Two seats, please.';
    return { ok: ok, detail: location.search };
  };
</script></body></html>
