<!doctype html><html><head><meta charset="utf-8"><title>Virtual list</title><link rel="stylesheet" href="style.css">
<style>#list{position:relative;height:320px;overflow:auto;border:1px solid #e2e8f0;border-radius:10px}.row{position:absolute;left:0;right:0;height:36px;padding:8px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer}.row:hover{background:#f8fafc}</style></head>
<body><main>
  <h1>Customers (virtual list, 5,000 rows)</h1>
  <div id="list"><div id="spacer"></div></div>
  <p id="sel" class="muted">Nothing selected</p>
</main>
<script>
  var N = 5000, H = 36, list = document.getElementById('list'), spacer = document.getElementById('spacer');
  spacer.style.height = (N * H) + 'px';
  function render() {
    var first = Math.max(0, Math.floor(list.scrollTop / H) - 3), last = Math.min(N, first + Math.ceil(320 / H) + 6);
    [].slice.call(list.querySelectorAll('.row')).forEach(function (r) { r.remove(); });
    for (var i = first; i < last; i++) {
      var r = document.createElement('div'); r.className = 'row'; r.style.top = (i * H) + 'px'; r.textContent = 'Customer ' + (i + 1);
      r.onclick = (function (n) { return function () { document.getElementById('sel').textContent = 'Selected Customer ' + n; }; })(i + 1);
      list.appendChild(r);
    }
  }
  list.addEventListener('scroll', render); render();
  window.__verify = function () {
    var t = document.getElementById('sel').textContent;
    return { ok: t === 'Selected Customer 140', detail: t };
  };
</script></body></html>
