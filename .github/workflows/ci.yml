name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build + unit tests
        run: npm test
      - name: Compatibility suite (React, Vue, Alpine, shadow DOM, iframes, …)
        run: node test/e2e/compat.js
      - name: Recorder integration (frames, realtime, render outputs)
        run: node test/e2e/record.js
      - name: Types
        run: npx -y -p typescript@5.6.3 tsc -p test/types
      - name: "Visual regression (informational: fonts differ between machines)"
        if: matrix.node == 22
        continue-on-error: true
        run: node test/e2e/visual.js
      - name: Keep the outputs of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-node${{ matrix.node }}
          path: test/.output/
          retention-days: 7
