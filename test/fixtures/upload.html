<!doctype html><html><head><meta charset="utf-8"><title>Upload</title><link rel="stylesheet" href="style.css">
<style>.drop{margin-top:18px;padding:30px;border:2px dashed #cbd5e1;border-radius:12px;text-align:center;color:#64748b}.drop.over{border-color:#4f46e5;background:#eef2ff}</style></head>
<body><main>
  <h1>Attachments (upload)</h1>
  <label class="btn" for="file" style="display:inline-block">Choose file</label>
  <input id="file" type="file" hidden>
  <p id="picked" class="muted">No file</p>
  <div class="drop" id="drop">Drop files here</div>
  <p id="dropped" class="muted"></p>
</main>
<script>
  document.getElementById('file').addEventListener('change', function (e) {
    var f = e.target.files[0];
    f.text().then(function (t) { document.getElementById('picked').textContent = f.name + ' · ' + t.trim(); });
  });
  var d = document.getElementById('drop');
  d.addEventListener('dragover', function (e) { e.preventDefault(); d.classList.add('over'); });
  d.addEventListener('dragleave', function () { d.classList.remove('over'); });
  d.addEventListener('drop', function (e) { e.preventDefault(); d.classList.remove('over');
    document.getElementById('dropped').textContent = [].map.call(e.dataTransfer.files, function (f) { return f.name; }).join(', '); });
  window.__verify = function () {
    var a = document.getElementById('picked').textContent, b = document.getElementById('dropped').textContent;
    return { ok: a === 'sample.txt · Invoice 2026-11 · £4,000' && b === 'notes.md', detail: a + ' / ' + b };
  };
</script></body></html>
