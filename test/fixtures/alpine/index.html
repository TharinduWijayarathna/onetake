<!doctype html><html><head><meta charset="utf-8"><title>Alpine</title><link rel="stylesheet" href="../style.css">
<script defer src="/node_modules/alpinejs/dist/cdn.min.js"></script>
<style>.menu{position:absolute;margin-top:6px;background:#fff;border:1px solid #e2e8f0;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.12);min-width:200px;padding:6px}
.menu a{display:block;padding:8px 12px;border-radius:6px;color:inherit;text-decoration:none}.menu a:hover{background:#eef2ff}</style></head>
<body><main x-data="{ open: false, status: 'Draft' }">
  <h1>Document (Alpine)</h1>
  <p>Status: <strong id="status" x-text="status"></strong></p>
  <div style="position:relative">
    <button @click="open = !open" aria-haspopup="menu">Change status</button>
    <div class="menu" role="menu" x-show="open" x-transition.duration.200ms @click.outside="open = false">
      <a href="#" role="menuitem" @click.prevent="status = 'In review'; open = false">In review</a>
      <a href="#" role="menuitem" @click.prevent="status = 'Published'; open = false">Published</a>
    </div>
  </div>
</main>
<script>
  window.__verify = function () {
    var s = document.getElementById('status').textContent, menu = document.querySelector('.menu');
    return { ok: s === 'Published' && getComputedStyle(menu).display === 'none', detail: s };
  };
</script></body></html>
