<!doctype html><html><head><meta charset="utf-8"><title>New inquiry</title><link rel="stylesheet" href="../style.css"></head>
<body><main>
  <h1>New inquiry</h1>
  <form action="done.html" method="get">
    <label for="name">Client name</label><input id="name" name="name" required>
    <label for="email">Email</label><input id="email" name="email" type="email" required>
    <label for="kind">Type</label>
    <select id="kind" name="kind"><option value="">Choose…</option><option>Quote</option><option>Support</option></select>
    <label for="msg">Message</label><textarea id="msg" name="msg" rows="3"></textarea>
    <p><button type="submit">Send inquiry</button></p>
  </form>
</main></body></html>
