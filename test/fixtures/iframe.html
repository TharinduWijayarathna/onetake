<!doctype html><html><head><meta charset="utf-8"><title>Iframe</title><link rel="stylesheet" href="style.css"></head>
<body><main>
  <h1>Checkout (iframe)</h1>
  <p class="muted">The payment form lives in an iframe.</p>
  <iframe id="pay" src="iframe-inner.html" style="width:100%;height:240px;border:1px solid #e2e8f0;border-radius:10px"></iframe>
  <p id="out"></p>
</main>
<script>
  window.addEventListener('message', function (e) { document.getElementById('out').textContent = e.data; });
  window.__verify = function () {
    var t = document.getElementById('out').textContent;
    return { ok: t === 'Paid by Ada Lovelace', detail: t };
  };
</script></body></html>
