<!doctype html><html><head><meta charset="utf-8"><title>React</title><link rel="stylesheet" href="style.css">
<script src="/node_modules/react/umd/react.production.min.js"></script>
<script src="/node_modules/react-dom/umd/react-dom.production.min.js"></script></head>
<body><main id="root"></main>
<script>
  var h = React.createElement;
  function App() {
    var s = React.useState(''), text = s[0], setText = s[1];
    var l = React.useState(['Write the brief']), items = l[0], setItems = l[1];
    var p = React.useState(false), pro = p[0], setPro = p[1];
    return h(React.Fragment, null,
      h('h1', null, 'Tasks (React)'),
      h('label', { htmlFor: 'task' }, 'New task'),
      h('input', { id: 'task', value: text, onChange: function (e) { setText(e.target.value); } }),
      h('label', null, h('input', { type: 'checkbox', checked: pro, onChange: function (e) { setPro(e.target.checked); }, style: { width: 'auto' } }), ' Priority'),
      h('p', null, h('button', { disabled: !text.trim(), onClick: function () { setItems(items.concat(text + (pro ? ' ★' : ''))); setText(''); } }, 'Add task')),
      h('ul', { id: 'list' }, items.map(function (t, i) { return h('li', { key: i }, t); })));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(App));
  window.__verify = function () {
    var li = [].map.call(document.querySelectorAll('#list li'), function (x) { return x.textContent; });
    return { ok: li[1] === 'Ship the demo ★' && document.getElementById('task').value === '', detail: li.join(' | ') };
  };
</script></body></html>
