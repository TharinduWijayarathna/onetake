<!doctype html><html><head><meta charset="utf-8"><title>Combobox</title><link rel="stylesheet" href="style.css">
<style>#lb{list-style:none;margin:4px 0 0;padding:4px;border:1px solid #e2e8f0;border-radius:8px;max-height:200px;overflow:auto}#lb li{padding:7px 10px;border-radius:6px;cursor:pointer}#lb li:hover{background:#eef2ff}</style></head>
<body><main>
  <h1>Office (combobox)</h1>
  <label for="city">City</label>
  <input id="city" role="combobox" aria-expanded="false" aria-controls="lb" autocomplete="off">
  <ul id="lb" role="listbox" hidden></ul>
  <p id="out" class="muted"></p>
</main>
<script>
  var cities = ['Amsterdam', 'Barcelona', 'Berlin', 'Bern', 'Colombo', 'Lisbon', 'London'];
  var input = document.getElementById('city'), lb = document.getElementById('lb');
  input.addEventListener('input', function () {
    // results arrive "from the server" a little later
    var q = input.value.toLowerCase();
    fetch('style.css').then(function () {
      var hits = q ? cities.filter(function (c) { return c.toLowerCase().indexOf(q) !== -1; }) : [];
      lb.innerHTML = hits.map(function (c) { return '<li role="option">' + c + '</li>'; }).join('');
      lb.hidden = !hits.length; input.setAttribute('aria-expanded', String(!!hits.length));
    });
  });
  lb.addEventListener('click', function (e) {
    var li = e.target.closest('li'); if (!li) return;
    input.value = li.textContent; lb.hidden = true; document.getElementById('out').textContent = 'Office: ' + li.textContent;
  });
  window.__verify = function () {
    var t = document.getElementById('out').textContent;
    return { ok: t === 'Office: Berlin' && input.value === 'Berlin', detail: t };
  };
</script></body></html>
