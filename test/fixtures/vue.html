<!doctype html><html><head><meta charset="utf-8"><title>Vue</title><link rel="stylesheet" href="style.css">
<script src="/node_modules/vue/dist/vue.global.prod.js"></script></head>
<body><main id="app">
  <h1>Pricing (Vue)</h1>
  <label for="seats">Seats</label><input id="seats" type="number" v-model.number="seats">
  <label for="plan">Plan</label>
  <select id="plan" v-model="plan"><option>Starter</option><option>Pro</option></select>
  <p>Total: <strong id="total">{{ total }}</strong></p>
  <p v-if="seats >= 10" id="discount">Volume discount applied</p>
</main>
<script>
  Vue.createApp({
    data: function () { return { seats: 1, plan: 'Starter' }; },
    computed: { total: function () { var p = this.plan === 'Pro' ? 30 : 10; var t = this.seats * p; if (this.seats >= 10) t *= 0.9; return '$' + t.toFixed(0); } }
  }).mount('#app');
  window.__verify = function () {
    var t = document.getElementById('total').textContent;
    return { ok: t === '$324' && !!document.getElementById('discount'), detail: t };
  };
</script></body></html>
